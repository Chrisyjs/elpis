    <script>
        const handleClick = async () => {
            const signKey = "adsadsads3313131adsadasdda1111";
            const st = Date.now();
            const res = await axios.request({
                method: 'POST',
                url: '/api/project/getList',
                data: {
                    proj_key:1
                },
                headers: {
                    s_t: st, s_sign: md5(`${signKey}_${st}`)
                }
            });
